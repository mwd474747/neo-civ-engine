name: Publish Iron Theater compiled preview

on:
  push:
    branches:
      - iron-theater-live

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-cdc0-822f-a560-99af79fe1a5d/raw?se=2026-08-24T16%3A40%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=0c5a5988-c0d5-5cbc-b4c3-1c88df58db93&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T12%3A12%3A41Z&ske=2026-08-25T12%3A12%3A41Z&sks=b&skv=2026-02-06&sig=xB5WpvcuoRByFVwc3G7XMShVJvE2WErNvqYX6qT5Jvs%3D"

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4

      - name: Download compiled preview artifact
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 "${ARTIFACT_URL}" --output /tmp/iron-theater-preview.zip
          unzip -t /tmp/iron-theater-preview.zip

      - name: Replace branch contents with compiled site
        run: |
          set -euxo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/iron-theater-preview.zip -d .
          test -f index.html
          test -f assets/index-BYVjWpN3.js
          test -f data/countries-110m.json
          test -f game/earth.jpg
          printf '%s\n' "Built from private Iron Theater artifact ${GITHUB_RUN_ID}" > DEPLOYED_FROM.txt

      - name: Publish compiled files
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Iron Theater compiled preview"
          git push origin HEAD:iron-theater-live
